# ──────────────────────────────────────────────────────
# Nginx 配置片段：MCP Server 反向代理（路径模式，已合并到 priceminder.conf）
# 实际配置见远程服务器 /opt/dockerimg/nginx/ssl/priceminder.conf
# ──────────────────────────────────────────────────────

# 以下为参考配置，端口 8082 对应 Docker 容器映射

server {
    listen 80;
    server_name mcp.priceminder.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.priceminder.online;

    # SSL 证书（Let's Encrypt 或自有证书）
    ssl_certificate     /etc/letsencrypt/live/mcp.priceminder.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.priceminder.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 日志
    access_log /var/log/nginx/mcp_access.log;
    error_log  /var/log/nginx/mcp_error.log;

    # 反向代理到 MCP Server（本地 8020 端口）
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        # Streamable HTTP 需要 SSE 支持
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（MCP 连接可能较长）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查（可选，给负载均衡器用）
    location /health {
        proxy_pass http://127.0.0.1:8020/health;
        proxy_set_header Host $host;
    }
}
